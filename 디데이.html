<!DOCTYPE html>

  <style>
    html, body {
      margin: 0;

      width: 100%;

    }
    * { box-sizing: border-box; }

    /* 컴팩트 각진 사각형 컨테이너 */
    .widget-container {

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 380px;
    }
