<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만다라트</title>
    <style>
        :root {
            --color-center: #FFE0EA; /* 중심부: 맑고 생기 있는 핑크 */
            --color-mid: #FFF0F5;    /* 중간 목표: 투명한 라이트 핑크 */
            --color-outer: #FFFAFC;  /* 외곽 실행과제: 아주 맑고 연한 핑크화이트 */
            --notion-bg: #FFFFFF;    /* 노션 기본 배경색 */
            --text-color: #5C434A;   /* 부드러운 로즈브라운 글자색 */
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--notion-bg);
            margin: 0;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 겉 테두리와 배경을 없애고 투명한 격자 느낌 구현 */
        .mandalart-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px; /* 칸들 사이의 간격이 노션 배경색으로 비쳐 투명한 느낌 연출 */
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }

        .sub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px; /* 서브박스 내부 간격 */
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }

        .cell {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 500;
            line-height: 1.2;
            padding: 3px;
            border-radius: 0; /* 각진 사각형 */
            word-break: keep-all;
            overflow-wrap: break-word;
            outline: none;
            cursor: text;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .cell:focus {
            box-shadow: inset 0 0 0 1.5px #ECA8BE;
        }

        /* 맑고 투명한 3단계 파스텔 핑크 계층 */
        .cell.tier-center {
            background-color: var(--color-center);
            font-weight: 700;
        }

        .cell.tier-mid {
            background-color: var(--color-mid);
            font-weight: 600;
        }

        .cell.tier-outer {
            background-color: var(--color-outer);
        }

        @media (max-width: 600px) {
            .cell {
                width: 38px;
                height: 38px;
                font-size: 0.55rem;
                padding: 2px;
            }
            .mandalart-container {
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="mandalart-container">
        <!-- 1번 서브박스 (좌상) -->
        <div class="sub-grid">
            <div class="cell tier-outer" contenteditable="true"></div>

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true">세부목표</div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>

</body>
