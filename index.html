<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만다라트</title>
    <style>
        :root {
            --color-center: #FFD6E2; /* 중심부: 화사한 베이비핑크 */
            --color-mid: #FFE7EE;    /* 중간 목표: 맑은 라이트 베이비핑크 */
            --color-outer: #FFF4F7;  /* 외곽 실행과제: 뽀얀 딸기우유빛 핑크 */
            --notion-bg: #FFFFFF;    /* 노션 기본 배경색 (#FFFFFF) */
            --outer-frame: #F7D1DC;  /* 각진 외곽 테두리선 */
            --text-color: #5C434A;   /* 화사한 핑크와 어울리는 부드러운 로즈브라운 글자색 */
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--notion-bg);
            margin: 0;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .mandalart-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background-color: var(--notion-bg);
            border: 1.5px solid var(--outer-frame);
            padding: 6px;
            border-radius: 0; /* 각진 사각형 */
        }

        .sub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background-color: var(--notion-bg);
            padding: 0;
            border-radius: 0;
        }

        .cell {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 500;
            line-height: 1.2;
            padding: 3px;
            border-radius: 2px;
            word-break: keep-all;
            overflow-wrap: break-word;
            outline: none;
            cursor: text;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .cell:focus {
            box-shadow: inset 0 0 0 1.5px #F2A7BD;
        }

        /* 베이비핑크 3단계 계층 */
        .cell.tier-center {
            background-color: var(--color-center);
            font-weight: 700;
        }

        .cell.tier-mid {
            background-color: var(--color-mid);
            font-weight: 600;
        }

        .cell.tier-outer {
            background-color: var(--color-outer);
        }

        @media (max-width: 600px) {
            .cell {
                width: 38px;
                height: 38px;
                font-size: 0.55rem;
                padding: 2px;
            }
            .mandalart-container {
                gap: 4px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="mandalart-container">
        <!-- 1번 서브박스 (좌상) -->
        <div class="sub-grid">
            <div class="cell tier-outer" contenteditable="true"></div>

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>

</body>
