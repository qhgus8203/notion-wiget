<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만다라트</title>
    <style>
        :root {
            --color-center: #FFEBF0; /* 1번째: 중심부 */
            --color-mid: #DBCACE;    /* 2번째: 중간 목표 */
            --color-outer: #B3A4A8;  /* 3번째: 외곽 실행과제 */
            --border-color: #9e8f93; /* 칸 구분선 */
            --text-color: #3d3134;   /* 고정 글자색 */
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .mandalart-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background-color: var(--border-color);
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .sub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background-color: var(--border-color);
            padding: 2px;
            border-radius: 6px;
        }

        .cell {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 500;
            line-height: 1.2;
            padding: 3px;
            border-radius: 4px;
            word-break: keep-all;
            overflow-wrap: break-word;
            outline: none;
            cursor: text;
            color: var(--text-color);
            box-sizing: border-box;
        }

        /* 입력 및 수정 시 배경색/글자색 변화 없음 (테두리만 살짝 표시) */
        .cell:focus {
            box-shadow: inset 0 0 0 1.5px #61595B;
        }

        /* 3가지 색상 계층 */
        .cell.tier-center {
            background-color: var(--color-center);
            font-weight: 700;
        }

        .cell.tier-mid {
            background-color: var(--color-mid);
            font-weight: 600;
        }

        .cell.tier-outer {
            background-color: var(--color-outer);
        }

        @media (max-width: 600px) {
            .cell {
                width: 38px;
                height: 38px;
                font-size: 0.55rem;
                padding: 2px;
            }
            .mandalart-container {
                gap: 4px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="mandalart-container">
        <!-- 1번 서브박스 (좌상) -->
        <div class="sub-grid">
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true">세부목표</div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
        </div>

        <!-- 2번 서브박스 (중상) -->

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true">세부목표</div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
        </div>

        <!-- 3번 서브박스 (우상) -->
        <div class="sub-grid">
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true">세부목표</div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
        </div>

        <!-- 4번 서브박스 (좌중) -->

        </div>

        <!-- 5번 서브박스 (정중앙) -->

            <div class="cell tier-mid" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true"></div>
            <div class="cell tier-center" contenteditable="true">핵심목표</div>
            <div class="cell tier-mid" contenteditable="true"></div>

        </div>

        <!-- 6번 서브박스 (우중) -->

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
        </div>

        <!-- 7번 서브박스 (좌하) -->
        <div class="sub-grid">
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true">세부목표</div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>

        </div>

        <!-- 9번 서브박스 (우하) -->

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-mid" contenteditable="true">세부목표</div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>
        </div>
    </div>

</body>
</html>
