<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 만다라트</title>
    <style>
        :root {
            --color-center: #FFEBF0; /* 중심부 */
            --color-ring-1: #DBCACE; /* 1단계 외곽 */
            --color-ring-2: #B3A4A8; /* 2단계 외곽 */
            --color-ring-3: #8A7F81; /* 3단계 외곽 */
            --color-outer: #61595B;  /* 최외곽 및 배경 */
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f7f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--color-outer);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .mandalart-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background-color: var(--color-outer);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .sub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background-color: var(--color-outer);
            padding: 4px;
            border-radius: 8px;
        }

        .cell {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px;
            border-radius: 6px;
            word-break: break-all;
            outline: none;
            cursor: text;
            transition: transform 0.1s ease;
        }

        .cell:focus {
            box-shadow: inset 0 0 0 2px #333;
            background-color: #fff !important;
        }

        /* 계층별 색상 매핑 */
        .cell.center-core {
            background-color: var(--color-center);
            color: #4a3b3e;
            font-weight: bold;
        }

        .cell.ring-1 {
            background-color: var(--color-ring-1);
            color: #3d3134;
        }

        .cell.ring-2 {
            background-color: var(--color-ring-2);
            color: #fff;
        }

        .cell.ring-3 {
            background-color: var(--color-ring-3);
            color: #fff;
        }

        .cell.outer {
            background-color: var(--color-outer);
            color: #f7f5f5;
        }

        @media (max-width: 768px) {
            .cell {
                width: 50px;
                height: 50px;
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <h1>✨ 나의 만다라트 계획표</h1>

    <div class="mandalart-container">
        <!-- 1번 서브박스 (좌상) -->
        <div class="sub-grid">
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true">목표</div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
        </div>

        <!-- 2번 서브박스 (중상) -->
        <div class="sub-grid">
            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-1" contenteditable="true">목표</div>
            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true"></div>

        <!-- 3번 서브박스 (우상) -->

            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true">목표</div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
        </div>

        <!-- 4번 서브박스 (좌중) -->

        <!-- 6번 서브박스 (우중) -->

            <div class="cell ring-2" contenteditable="true"></div>
            <div class="cell ring-2" contenteditable="true"></div>
        </div>

        <!-- 7번 서브박스 (좌하) -->
        <div class="sub-grid">
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>
            <div class="cell ring-3" contenteditable="true"></div>

        </div>
    </div>

</body>
</html>
