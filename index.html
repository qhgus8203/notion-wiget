<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion Task Heatmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.css" />
    <style>
        body {
            background-color: transparent !important;
            color: inherit;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        #widget-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #widget-title {
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: inherit;
            outline: none;
            padding: 2px 4px;
            width: 140px;
        }
        #widget-title:focus {
            border-bottom: 1px solid #ff8fab;
        }
        .period-buttons {
            display: flex;
            gap: 4px;
        }
        .period-buttons button {
            background: rgba(255, 182, 193, 0.2);
            border: 1px solid #ffb3c6;
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 11px;
            color: inherit;
            transition: all 0.2s;
        }
        .period-buttons button:hover, .period-buttons button.active {
            background: #ffb3c6;
            color: #fff;
        }
        #cal-heatmap {
            overflow-x: auto;
        }
        /* 파스텔 핑크 테두리 및 둥근 모서리 설정 */
        .graph-rect {
            stroke: #ffb3c6 !important;
            stroke-width: 1px !important;
            rx: 3px;
            ry: 3px;
        }
    </style>
</head>
<body>
    <div id="widget-container">
        <div class="header-bar">
            <input type="text" id="widget-title" value="💡 나의 습관 트래커" />
            <div class="period-buttons">
                <button onclick="changeRange(7)">7일</button>
                <button onclick="changeRange(14)">14일</button>
                <button onclick="changeRange(30)" class="active">30일</button>
                <button onclick="changeRange(31)">31일</button>
            </div>
        </div>
        <div id="cal-heatmap"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.min.js"></script>
    <script>
        let cal = new CalHeatMap();
        const baseUrl = window.location.origin;

        function initHeatmap(days) {
            document.getElementById('cal-heatmap').innerHTML = "";
            cal = new CalHeatMap();
            
            // 일수 계산에 따른 domain 및 range 설정 (30일/31일은 1개월 단위, 7/14일은 주 단위 설정)
            let domainType = "month";
            let numRange = 1;
            let startDate = new Date();

            if (days === 7) {
                domainType = "day";
                numRange = 7;
                startDate.setDate(startDate.getDate() - 7);
            } else if (days === 14) {
                domainType = "day";
                numRange = 14;
                startDate.setDate(startDate.getDate() - 14);
            } else if (days === 30 || days === 31) {
                startDate.setDate(startDate.getDate() - days);
            }

            cal.init({
                itemSelector: "#cal-heatmap",
                domain: domainType,
                subDomain: "day",
                data: baseUrl + "/api/database",
                start: startDate,
                cellSize: 11,
                range: numRange,
                tooltip: true,
                considerMissingDataAsZero: false,
                legend: [25, 50, 65, 80],
                legendColors: {
                    min: "#fff0f3",
                    base: "#fff0f3",
                    colors: ["#fff0f3", "#ffb3c6", "#ff8fab", "#fb6f92", "#c9184a"],
                    empty: "#fff0f3"
                },
                subDomainTitleFormat: {
                    empty: "{date}",
                    filled: "{count}% on {date}"
                },
                afterLoadData: function(data) {
                    if (!data) return {};
                    var result = {};
                    data.forEach(function(item) {
                        var date = new Date(item.date).getTime() / 1000;
                        result[date] = item.progress;
                    });
                    return result;
                }
            });
        }

        function changeRange(days) {
            // 버튼 활성화 스타일 변경
            document.querySelectorAll('.period-buttons button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            initHeatmap(days);
        }

        document.addEventListener('DOMContentLoaded', function() {
            initHeatmap(30); // 기본 30일 설정

            // 30초마다 데이터 자동 갱신
            setInterval(function() {
                cal.update(baseUrl + "/api/database");
            }, 30000);
        });
    </script>
</body>
</html>
