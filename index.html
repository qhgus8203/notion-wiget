<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Notion D-Day Widget</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    * { box-sizing: border-box; }

    /* 각진 사각형 테두리 적용 (border-radius를 4px로 변경) */
    .widget-container {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 24px 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 480px;
    }

    /* 상단 영역: "D-DAY" 문구를 중앙에 오도록 배치 */
    .widget-header {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding-bottom: 10px;
      border-bottom: 1px solid #f3f4f6;
    }

    .widget-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #362729;
      margin: 0;
      text-align: center;
    }

    /* 우측 상단에 고정되는 추가 버튼 */
    .toggle-btn {
      position: absolute;
      right: 0;
      background: #f3f4f6;
      border: none;
      color: #362729;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 4px; /* 버튼도 각진 느낌으로 수정 */
      cursor: pointer;
      font-family: 'Pretendard', sans-serif;
      transition: background 0.2s;
    }
    .toggle-btn:hover {
      background: #e5e7eb;
    }

    /* 디데이 항목 리스트 (가로 배치) */
    .dday-list {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 32px;
      width: 100%;
      min-height: 110px;
    }

    /* 개별 디데이 아이템 */
    .dday-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    /* 원형 선 그래프 영역 */
    .circle-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .progress-ring {
      transform: rotate(-90deg);
    }
