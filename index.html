<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만다라트</title>
    <style>
        :root {
            --color-center: #FFEBF0; /* 중심부: 화사한 연핑크 */
            --color-mid: #F7DCE3;    /* 중간 목표: 맑은 파스텔 핑크 */
            --color-outer: #EFE4E7;  /* 외곽 실행과제: 밝은 로즈 아이보리 */
            --border-color: #FFFFFF; /* 칸 구분선: 깔끔한 화이트 */
            --outer-frame: #E5D6DA;  /* 전체 외곽선: 은은한 연회핑크 */
            --text-color: #4A3E41;   /* 부드러운 다크 브라운그레이 글자색 */
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .mandalart-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background-color: var(--border-color);
            border: 2px solid var(--outer-frame);
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(179, 164, 168, 0.15);
        }

        .sub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background-color: var(--border-color);
            padding: 2px;
            border-radius: 6px;
        }

        .cell {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 500;
            line-height: 1.2;
            padding: 3px;
            border-radius: 4px;
            word-break: keep-all;
            overflow-wrap: break-word;
            outline: none;
            cursor: text;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .cell:focus {
            box-shadow: inset 0 0 0 1.5px #B3A4A8;
        }

        /* 밝아진 3가지 색상 계층 */
        .cell.tier-center {
            background-color: var(--color-center);
            font-weight: 700;
        }

        .cell.tier-mid {
            background-color: var(--color-mid);
            font-weight: 600;
        }

        .cell.tier-outer {
            background-color: var(--color-outer);
        }

        @media (max-width: 600px) {
            .cell {
                width: 38px;
                height: 38px;
                font-size: 0.55rem;
                padding: 2px;
            }
            .mandalart-container {
                gap: 4px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="mandalart-container">
        <!-- 1번 서브박스 (좌상) -->
        <div class="sub-grid">
            <div class="cell tier-outer" contenteditable="true"></div>

            <div class="cell tier-outer" contenteditable="true"></div>
            <div class="cell tier-outer" contenteditable="true"></div>

            <div class="cell tier-outer" contenteditable="true"></div>

            <div class="cell tier-outer" contenteditable="true"></div>

</body>
