<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Notion D-Day Widget</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    * { box-sizing: border-box; }

    /* 사각형 배경 컨테이너 */
    .widget-container {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 24px 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 420px;
    }

    /* 상단 D-DAY 타이틀 (글자 크기 키움) */
    .widget-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #362729;
      text-align: center;
      margin: 0;
    }

    /* 디데이 항목 리스트 (간격 넓힘) */
    .dday-list {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 36px;
      width: 100%;
      min-height: 120px;
    }

    /* 개별 디데이 아이템 */
    .dday-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    /* 원형 선 그래프 영역 (크기 및 간격 여유 확보) */
    .circle-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring__bg {
      fill: transparent;
      stroke: #f3f4f6;
      stroke-width: 4.5;
    }

    .progress-ring__circle {
      fill: transparent;
      stroke: #362729; /* 요청하신 컬러 적용 */
      stroke-width: 4.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
    }

    /* 원형 그래프 정중앙 남은 날짜 숫자 (간격 및 크기 조절) */
    .dday-count {
      position: absolute;
      font-size: 24px;
      font-weight: 800;
      color: #362729;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* 그래프 밑 디데이 이름 */
    .dday-name {
      font-size: 13px;
      font-weight: 600;
      color: #362729;
      text-align: center;
      max-width: 110px;
      word-break: keep-all;
      line-height: 1.3;
    }

    /* 항목 삭제 버튼 (마우스 올릴 때 표시) */
    .delete-btn {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #fee2e2;
      color: #991b1b;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .dday-item:hover .delete-btn {
      display: flex;
    }

    /* 하단 직접 추가 입력 폼 스타일 */
    .input-form {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-top: 4px;
      padding-top: 14px;
      border-top: 1px solid #f3f4f6;
    }

    .input-form input {
      flex: 1;
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      outline: none;
      font-family: 'Pretendard', sans-serif;
    }

    .input-form input:focus {
      border-color: #362729;
    }

    .input-form button {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      background-color: #362729;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Pretendard', sans-serif;
    }

    /* 다크 모드 대응 */
    @media (prefers-color-scheme: dark) {
      .widget-container {
        background-color: #202020;
        border-color: #2f2f2f;
      }
      .widget-title, .dday-count, .dday-name { color: #f9fafb; }
      .progress-ring__bg { stroke: #2e2e2e; }
      .progress-ring__circle { stroke: #d1d5db; }
      .input-form { border-top-color: #2f2f2f; }
      .input-form input { background-color: #2a2a2a; border-color: #3f3f3f; color: #fff; }
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <h1 class="widget-title">D - DAY</h1>
    
    <div class="dday-list" id="dday-list"></div>

    <!-- 노션 위젯 화면 안에서 바로 추가하는 입력창 -->
    <div class="input-form">
      <input type="text" id="title-input" placeholder="이름 (예: 시험)" />
      <input type="date" id="date-input" />
      <button onclick="addDDay()">추가</button>
    </div>
  </div>

  <script>
    // 브라우저 저장소(localStorage)에서 기존 데이터 불러오기 (없으면 기본값 사용)
    let ddayItems = JSON.parse(localStorage.getItem('notion_dday_items')) || [
      { title: "기말고사", startDate: "2026-09-01", targetDate: "2026-12-15" },
      { title: "2027 새해", startDate: "2026-01-01", targetDate: "2027-01-01" }
    ];

    function renderDDays() {
      const listEl = document.getElementById('dday-list');
      listEl.innerHTML = '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const radius = 46; // 반지름을 살짝 키워 원형 크기 및 간격 확장
      const circumference = 2 * Math.PI * radius;

      ddayItems.forEach((item, index) => {
        const start = new Date(item.startDate + "T00:00:00");
        const target = new Date(item.targetDate + "T00:00:00");

        const diffTime = target - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        let ddayLabel = diffDays === 0 ? "0" : (diffDays > 0 ? `${diffDays}` : `+${Math.abs(diffDays)}`);

        const totalDuration = target - start;
        const elapsedDuration = today - start;
        let percentage = 0;

        if (totalDuration <= 0 || diffDays <= 0) { percentage = 100; }
        else if (elapsedDuration <= 0) { percentage = 0; }
        else { percentage = Math.min(Math.max((elapsedDuration / totalDuration) * 100, 0), 100); }

        const strokeDashoffset = circumference - (percentage / 100) * circumference;

        const itemEl = document.createElement('div');
        itemEl.className = 'dday-item';
        itemEl.innerHTML = `
          <div class="circle-wrapper" title="진행률 ${Math.round(percentage)}%">
            <svg class="progress-ring" width="108" height="108">
              <circle class="progress-ring__bg" r="${radius}" cx="54" cy="54" />
              <circle 
                class="progress-ring__circle" 
                r="${radius}" 
                cx="54" 
                cy="54" 
                style="stroke-dasharray: ${circumference} ${circumference}; stroke-dashoffset: ${strokeDashoffset};"
              />
            </svg>
            <span class="dday-count">${ddayLabel}</span>
          </div>
          <div class="dday-name">${item.title}</div>
          <button class="delete-btn" onclick="removeDDay(${index})" title="삭제">×</button>
        `;
        listEl.appendChild(itemEl);
      });
    }

    // 디데이 추가 함수
    function addDDay() {
      const titleInput = document.getElementById('title-input');
      const dateInput = document.getElementById('date-input');

      if (!titleInput.value || !dateInput.value) {
        alert("이름과 날짜를 모두 입력해주세요!");
        return;
      }

      const newItem = {
        title: titleInput.value,
        startDate: new Date().toISOString().split('T')[0], // 오늘 날짜를 시작일로 자동 지정
        targetDate: dateInput.value
      };

      ddayItems.push(newItem);
      localStorage.setItem('notion_dday_items', JSON.stringify(ddayItems));

      titleInput.value = '';
      dateInput.value = '';
      renderDDays();
    }

    // 디데이 삭제 함수
    function removeDDay(index) {
      ddayItems.splice(index, 1);
      localStorage.setItem('notion_dday_items', JSON.stringify(ddayItems));
      renderDDays();
    }

    renderDDays();
  </script>
</body>
</html>
